[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmregion-selector"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas",
  "MDAnalysis",
]
authors = [{ name = "Nancy Zhu", email = "nancyzmn@stanford.edu" }]
license = { file = "LICENSE" }
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["qmregion_selector*"]
